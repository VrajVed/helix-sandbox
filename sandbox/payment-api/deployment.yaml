apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: payment-api
        image: myrepo/payment-api:latest
        env:
        - name: PAYMENT_API_API_KEY
          valueFrom:
            secretKeyRef:
              name: payment-api-secret
              key: PAYMENT_API_API_KEY